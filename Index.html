<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine Surprise</title>
    <style>
        body {
            background-color: #ffcccb;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
        }
        .heart {
            position: absolute;
            background: red;
            width: 20px;
            height: 20px;
            transform: rotate(45deg);
            animation: float 5s ease-in-out infinite;
        }
        .heart:before, .heart:after {
            content: "";
            background: red;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            position: absolute;
        }
        .heart:before {
            top: -10px;
            left: 0;
        }
        .heart:after {
            left: 10px;
            top: 0;
        }
        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-30px); }
            100% { transform: translateY(0); }
        }
    </style>
</head>
<body>
    <h1>Happy Valentine's Day!</h1>
    <div id="typing-effect"></div>
    <audio id="romantic-music" src="path/to/your/romantic-music.mp3" loop></audio>
    <button id="yes-button">YES</button>
    <button id="no-button">NO</button>
    <script>
        const typingEffect = document.getElementById('typing-effect');
        const message = 'Will you be my Valentine?';
        let index = 0;
        function typeMessage() {
            if (index < message.length) {
                typingEffect.innerHTML += message.charAt(index);
                index++;
                setTimeout(typeMessage, 100);
            }
        }
        typeMessage();

        document.getElementById('yes-button').addEventListener('click', () => {
            alert('Yay! I knew you would say yes!');
        });

        document.getElementById('no-button').addEventListener('click', () => {
            alert('Oh no! But you will always be my special someone.');
        });

        window.onload = () => {
            document.getElementById('romantic-music').play();
            for (let i = 0; i < 30; i++) {
                createHeart();
            }
        };

        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 5 + 3 + 's';
            document.body.appendChild(heart);
            setTimeout(() => {
                heart.remove();
            }, 5000);
        }
    </script>
</body>
</html>
